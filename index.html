<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="plain-muscle. December 2026." />
    <meta name="theme-color" content="#ffffff" />
    <title>plain-muscle — December 2026</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html {
        background: #fff;
        color: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        color-scheme: light;
      }

      body {
        margin: 0;
      }

      main {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        padding-top: max(32px, env(safe-area-inset-top, 0px));
        padding-right: max(24px, env(safe-area-inset-right, 0px));
        padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
        padding-left: max(24px, env(safe-area-inset-left, 0px));
      }

      .announcement {
        width: 100%;
        text-align: center;
      }

      .mascot {
        position: relative;
        width: min(340px, 100%);
        margin: 0 auto 8px;
      }

      .logo {
        display: block;
        width: 100%;
        height: auto;
        filter: grayscale(1) contrast(2);
      }

      .sleep-letters {
        position: absolute;
        top: 20%;
        left: 56%;
        pointer-events: none;
        font-size: clamp(20px, 6vw, 24px);
        font-weight: 300;
        line-height: 1;
      }

      .sleep-letters span {
        position: absolute;
        opacity: 0;
        animation: sleep 4.5s ease-in-out infinite;
      }

      .sleep-letters span:nth-child(2) {
        animation-delay: -1.5s;
      }

      .sleep-letters span:nth-child(3) {
        animation-delay: -3s;
      }

      @keyframes sleep {
        0% {
          opacity: 0;
          transform: translate(0, 0.25em) scale(0.7) rotate(-8deg);
        }
        20% {
          opacity: 0.7;
        }
        55% {
          opacity: 0.6;
          transform: translate(0.625em, -1.667em) scale(1.1);
        }
        100% {
          opacity: 0;
          transform: translate(1.5em, -3.667em) scale(1.6) rotate(8deg);
        }
      }

      @media (max-height: 500px) and (orientation: landscape) {
        .mascot {
          width: min(240px, 50vh);
        }

        .sleep-letters {
          font-size: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sleep-letters span {
          animation-duration: 7.5s;
        }

        .sleep-letters span:nth-child(2) {
          animation-delay: -2.5s;
        }

        .sleep-letters span:nth-child(3) {
          animation-delay: -5s;
        }
      }

      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 300;
        line-height: 1.4;
        letter-spacing: 0.02em;
      }

      p {
        margin: 8px 0 0;
        font-size: 11px;
        font-weight: 300;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="announcement" aria-label="plain-muscle launch">
        <div class="mascot">
          <img
            class="logo"
            src="assets/plain-muscle.png"
            alt="A sleeping black mascot wearing headphones"
            width="1448"
            height="1086"
          />
          <div class="sleep-letters" aria-hidden="true">
            <span>z</span>
            <span>z</span>
            <span>z</span>
          </div>
        </div>
        <h1>plain-muscle</h1>
        <p><time datetime="2026-12">December 2026</time></p>
      </section>
    </main>
  </body>
</html>
